name: Deploy to Vercel

# Vercel's own Git integration stopped firing for this repo, so production
# deploys are driven from here instead. Runs on GitHub's runners, so it works
# regardless of which client pushed the commit.
# Manual only. This deliberately does NOT run on push: without a VERCEL_TOKEN
# secret it fails on every commit and buries real failures in false alarms.
# Add the secret (Settings > Secrets and variables > Actions), then either run
# it from the Actions tab or re-enable the push trigger below.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Not secrets — plain identifiers for the dft-admin project.
  VERCEL_ORG_ID: team_eCbNLKm2ZVG4tK6WSXq7vzbr
  VERCEL_PROJECT_ID: prj_In2t9T3T6ggKw4zsauzxfMtkZFOV

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the deploy token is present
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
